name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./web

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ./web/node_modules
            ./packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./web

      - name: Run ESLint
        run: pnpm lint
        working-directory: ./web

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./web

      - name: Build workspace packages
        run: pnpm -r build
      - name: Run TypeScript check
        run: pnpm typecheck
        working-directory: ./web

  workspace:
    name: Workspace Packages
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # packages/* resolve each other through dist/, which is not committed.
      # pnpm -r builds the graph in topological order:
      # core <- runtime/state <- mind <- sdk <- cli.
      # Without this, tsc fails with TS2307 across every dependent package.
      - name: Build workspace packages
        run: pnpm -r build

      - name: Typecheck workspace packages
        run: pnpm -r typecheck

      # Not run here: packages/* declare a "lint" script but ship no ESLint 9
      # flat config, so `pnpm -r lint` fails on config resolution rather than
      # on code. Adding it to this job would ship a permanently red check that
      # verifies nothing. Tracked as a separate gap.

      - name: Test workspace packages
        run: pnpm -r test

  build:
    name: Build Web Platform
    runs-on: ubuntu-latest
    needs: [lint, typecheck, workspace]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./web

      - name: Build Next.js application
        run: pnpm build
        working-directory: ./web

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: web/.next
          retention-days: 1

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./web

      # ./web tests import the workspace packages, which resolve through dist/.
      # dist/ is not committed, so without this the tests cannot resolve
      # @seai/core, @seai/state or @seai/runtime at all.
      - name: Build workspace packages
        run: pnpm -r build

      - name: Run tests
        run: pnpm test
        working-directory: ./web

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./web

      - name: Run npm audit
        run: pnpm audit --prod
        working-directory: ./web
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build, test, security, workspace]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: ./web/.next

      - name: Deploy to Vercel Preview
        # No `if:` guard here on purpose. `secrets` is not a valid context in
        # a step-level condition; referencing it makes the parser reject this
        # whole file, which produces a run with zero jobs and no logs.
        # continue-on-error handles a repository without Vercel credentials.
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=false'
        continue-on-error: true

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build, test, security, workspace]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: ./web/.next

      - name: Deploy to Vercel Production
        # No `if:` guard here on purpose. `secrets` is not a valid context in
        # a step-level condition; referencing it makes the parser reject this
        # whole file, which produces a run with zero jobs and no logs.
        # continue-on-error handles a repository without Vercel credentials.
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=true'
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        continue-on-error: true